async function startInput(deviceId){

let TAP_BPM=124,TAP_T0=0;
function fakeAudio(t){
  const beatLen=60/TAP_BPM,ph=(((t-TAP_T0)%beatLen)+beatLen)%beatLen/beatLen,bn=Math.floor((t-TAP_T0)/beatLen),
    E=[0.6,0.85,1,0.75][((Math.floor(bn/16)%4)+4)%4],brk=(((bn%32)+32)%32)>=28;
  const kick=brk?0:Math.exp(-ph*7)*E;
  const snare=(bn%2!==0)?Math.exp(-ph*10)*(brk?1:E):0;
  const hat=Math.exp(-((t%(beatLen/2))/(beatLen/2))*14);
  for(let i=0;i<freq.length;i++){
    const x=i/freq.length;
    const v=kick*Math.exp(-i/6)+snare*0.5*Math.exp(-Math.abs(i-60)/40)+hat*0.35*(x>0.3?Math.exp(-(x-0.3)*3):0)
      +0.28*(0.5+0.5*Math.sin(t*1.3+i*0.05))*Math.exp(-i/300)+Math.random()*0.06;
    freq[i]=Math.max(0,Math.min(255,v*255));
  }
  for(let i=0;i<wave.length;i++){
    const v=128+Math.sin(i*0.02+t*8)*60*kick+Math.sin(i*0.31)*20*hat+(Math.random()-.5)*30*snare+Math.sin(i*0.05+t)*15;
    wave[i]=Math.max(0,Math.min(255,v));
  }
}
let bass=0,mid=0,high=0,level=0,bassAvg=0.2,beat=false,beatPower=0,lastBeat=0,beatCount=0;const beatTimes=[];
function analyze(t){
  if(mode==='live'||mode==='file'||mode==='apps'){analyser.getByteFrequencyData(freq);analyser.getByteTimeDomainData(wave);}
  else fakeAudio(t);
  const avg=(a,b)=>{let s=0;for(let i=a;i<b;i++)s+=freq[i];return s/(b-a)/255;};
  bass=Math.min(1,avg(1,12)*INTENSITY);mid=Math.min(1,avg(12,120)*INTENSITY);high=Math.min(1,avg(120,500)*INTENSITY);
  level=(bass+mid+high)/3;
  envPush(t,bass);
  bassAvg=bassAvg*0.95+bass*0.05;
  beat=false;
  if(bass>bassAvg*1.2+0.04&&bass>0.25&&t-lastBeat>0.22){beat=true;lastBeat=t;beatCount++;beatTimes.push(t);if(beatTimes.length>24)beatTimes.shift();beatPower=Math.min(1,bass*1.1);}
  beatPower*=0.9;
}
function band(i,n){
  const a=Math.floor(Math.pow(i/n,2)*500)+1,b=Math.max(a+1,Math.floor(Math.pow((i+1)/n,2)*500)+1);
  let s=0;for(let k=a;k<b;k++)s+=freq[k];return Math.min(1,s/(b-a)/255*INTENSITY);
}

const tintCache=new Map();let tidN=0;
function tinted(src,w,h){
  src._tid=src._tid||++tidN;const k=src._tid+':'+w+'x'+h;
  let e=tintCache.get(k);if(e){tintCache.delete(k);tintCache.set(k,e);return e;}
  const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,s=Math.max(w/sw,h/sh),dw=sw*s,dh=sh*s;
  const fy=src.fy??0.5,oy=Math.min(0,Math.max(h-dh,h/2-dh*fy)),fx=src.fx??0.5,ox=Math.min(0,Math.max(w-dw,w/2-dw*fx));
  const mk=col=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
    g.fillStyle='#000';g.fillRect(0,0,w,h);g.drawImage(src,ox,oy,dw,dh);
    g.globalCompositeOperation='multiply';g.fillStyle=col;g.fillRect(0,0,w,h);return c;};
  e={w,h,r:mk('#f00'),g:mk('#0f0'),b:mk('#00f')};tintCache.set(k,e);
  while(tintCache.size>8)tintCache.delete(tintCache.keys().next().value);
  return e;
}

/* ================= UBUNTU AUDIO PROBE ================= */
let NOW=[]; // [{label,title}] from the desktop app
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let probe=null,probeT=0,peakHold=0;
// BPM: autocorrelation of the bass onset envelope over the last ~8 s (robust to missed beats)
const envT=[],envV=[];let bpmVal=0,bpmAt=0;
function envPush(t,v){envT.push(t);envV.push(v);while(envT.length&&t-envT[0]>8){envT.shift();envV.shift();}}
function bpmEst(){
  const now=envT.length?envT[envT.length-1]:0;
  if(now-bpmAt<0.5)return bpmVal;bpmAt=now;
  if(envT.length<30||now-envT[0]<4)return bpmVal;
  const R=0.02,n=Math.floor((now-envT[0])/R),g=new Float32Array(n);let j=0;
  for(let i=0;i<n;i++){const tt=envT[0]+i*R;while(j<envT.length-2&&envT[j+1]<=tt)j++;
    const a=envT[j],b=envT[j+1]||a,f=b>a?(tt-a)/(b-a):0;g[i]=envV[j]+(envV[j+1]-envV[j])*Math.max(0,Math.min(1,f));}
  const o=new Float32Array(n);let m=0;for(let i=1;i<n;i++){o[i]=Math.max(0,g[i]-g[i-1]);m+=o[i];}m/=n;for(let i=0;i<n;i++)o[i]-=m;
  let best=0,bl=0;const ac=[];
  for(let L=15;L<=40;L++){let sum=0;for(let i=L;i<n;i++)sum+=o[i]*o[i-L];ac[L]=sum;if(sum>best){best=sum;bl=L;}}
  if(!bl||best<=0)return bpmVal;
  let L=bl;if(bl>15&&bl<40){const y0=ac[bl-1],y1=ac[bl],y2=ac[bl+1],d=y0-2*y1+y2;if(d)L=bl+0.5*(y0-y2)/d;}
  let bpm=60/(L*R);while(bpm<80)bpm*=2;while(bpm>180)bpm/=2;
  bpmVal=bpmVal?bpmVal*0.6+bpm*0.4:bpm;return bpmVal;
}
function probeSnap(t){
  const sr=(actx&&actx.sampleRate)||48000,bin=sr/FFT;
  let sq=0,pk=0;for(let i=0;i<wave.length;i++){const v=(wave[i]-128)/128;sq+=v*v;const a=Math.abs(v);if(a>pk)pk=a;}
  const rms=Math.sqrt(sq/wave.length);bpmEst();peakHold=Math.max(pk,peakHold*0.97);
  let mx=0,mi=1,num=0,den=0;for(let i=1;i<600;i++){const v=freq[i];if(v>mx){mx=v;mi=i;}num+=v*i*bin;den+=v;}
  const hz=mi*bin,cen=den?num/den:0,midi=hz>0?Math.round(69+12*Math.log2(hz/440)):0;
  const db=x=>x>0.0001?(20*Math.log10(x)).toFixed(1):'-inf';
  const np=NOW.find(n=>n.title&&!/^(spotify( premium| free)?|virtualdj.*|youtube|media player)$/i.test(n.title.trim()));
  let title=DECKS.cur?DECKS.cur:np?np.title.replace(/ - (YouTube|Google Chrome|Microsoft​? Edge|Mozilla Firefox|Brave|Opera|Vivaldi).*$/i,'').replace(/ - YouTube$/i,''):'';
  const src=DECKS.cur&&!NOW.length?'VirtualDJ':NOW.length?NOW.map(n=>n.label).join('+'):(mode==='demo'?'demo_beat':mode==='file'?'local_file':mode);
  return {src,title:title||(NOW.length?'(no title exposed)':'—'),bpm:bpmVal,beats:beatCount,rms:db(rms),peak:db(peakHold),
    hz:Math.round(hz),note:mx>40&&midi>0?NOTES[midi%12]+(Math.floor(midi/12)-1):'--',cen:Math.round(cen),
    bass,mid,high,beat:t-lastBeat<0.12,energy:level,t};
}
function drawUbuntu(x,y,w,h,t){
  if(!probe||t-probeT>0.1){probe=probeSnap(t);probeT=t;}
  const p=probe,fs=Math.max(11,Math.min(15,Math.floor(h/24))),lh=fs+4;
  ctx.fillStyle='#300a24';ctx.fillRect(x,y,w,h);
  ctx.font=fs+'px "Ubuntu Mono",Menlo,Consolas,monospace';ctx.textBaseline='top';ctx.textAlign='left';
  let cy=y+6;const X=x+8;
  const seg=(parts)=>{let cx=X;for(const [txt,col] of parts){ctx.fillStyle=col;ctx.fillText(txt,cx,cy);cx+=ctx.measureText(txt).width;}cy+=lh;};
  const prompt=cmd=>seg([[USERHOST,'#8ae234'],[':','#fff'],['~/decks','#729fcf'],['$ ','#fff'],[cmd,'#fff']]);
  prompt('./audio_probe --live --fft '+FFT);
  const K='#34e2e2',N='#fcaf3e',S='#fce94f',C='#888a85',P='#d3d7cf';
  const bar=(v,n)=>'█'.repeat(Math.round(Math.min(1,v)*n))+'░'.repeat(n-Math.round(Math.min(1,v)*n));
  const n=Math.max(8,Math.floor((w-16)/(fs*0.6))-26);
  seg([['const ',C],['track',P],[' = {',P]]);
  const kv=(k,v,col,extra)=>seg([['  '+k.padEnd(10),K],[': ',P],[v,col],[',',P],...(extra?[['  // '+extra,C]]:[])]);
  kv('source',"'"+p.src+"'",S);
  kv('now_playing',"'"+String(p.title).slice(0,Math.max(10,n+8))+"'",S);
  kv('bpm',p.bpm?p.bpm.toFixed(1):'null',N,p.bpm?'autocorr · '+p.beats+' hits':'listening…');

    seg([['    '+k.padEnd(5),K],[': ',P],[v.toFixed(3),N],['  ',P],[bar(v,n),c]]);

  const wy=cy+lh*0.6,ww=w-16;for(let i=0;i<=ww;i+=2){const v=(wave[Math.floor(i/ww*(wave.length-1))]-128)/128;const yy=wy+v*lh*0.9;i?ctx.lineTo(X+i,yy):ctx.moveTo(X+i,yy);}ctx.stroke();
  cy+=lh*1.6;
  prompt('');if(Math.floor(t*2)%2){ctx.fillStyle='#fff';ctx.fillRect(X+ctx.measureText(USERHOST+':~/decks$ ').width,cy-lh+2,fs*0.55,fs);}
}

/* ================= PANELS ================= */
const M=12,CW=(W-5*M)/4,CH=(H-4*M)/3,TB=22;
function cell(c,r,w,h){return{x:M+c*(CW+M),y:M+r*(CH+M),w:w*CW+(w-1)*M,h:h*CH+(h-1)*M};}
let dt=0.016,tNow=0;

const peaks=new Float32Array(64);
function drawBars(x,y,w,h,t){
  const n=64,bw=w/n;
  for(let i=0;i<n;i++){
    const v=band(i,n),bh=v*(h-10);peaks[i]=Math.max(peaks[i]-0.5*dt,v);
    ctx.fillStyle=`hsl(${(i/n*300+t*40)%360},100%,55%)`;ctx.fillRect(x+i*bw+1,y+h-bh,bw-2,bh);
    ctx.fillStyle='#fff';ctx.fillRect(x+i*bw+1,y+h-peaks[i]*(h-10)-3,bw-2,2);

}

function ellipseFill(cx,cy,rx,ry){ctx.beginPath();ctx.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fill();}
function drawRadial(x,y,w,h,t){
  const cx=x+w/2,cy=y+h/2+10,R=Math.min(w,h)*0.2*(1+bass*0.25),n=96;
  ctx.save();ctx.translate(cx,cy);ctx.rotate(t*0.3);ctx.lineWidth=3;ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const v=band(i<48?i:95-i,48),ang=i/n*Math.PI*2,len=v*Math.min(w,h)*0.3;

    ctx.drawImage(ri,c[0],c[1],c[2],c[3],cx-rr2,cy-rr2,rr2*2,rr2*2);
    for(let i=0;i<Math.floor(beatPower*8*Q);i++){const D=rr2*2,hh=rnd(3,rr2*0.3),ry=Math.random()*(D-hh);ctx.drawImage(ri,c[0],c[1]+ry/D*c[3],c[2],hh/D*c[3],cx-rr2+rnd(-1,1)*30*beatPower,cy-rr2+ry,D,hh);}

function drawScope(x,y,w,h,t){

    for(let i=0;i<n;i+=4){const px=x+i/n*w,py=y+h/2+yo+(wave[(i+off)%n]-128)/128*g;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}

  trace('rgba(255,43,214,0.7)',40,beatPower*8);trace('#39ff14',0,0);

let ringPhase=0,ringF=-1;
function drawRings(x,y,w,h,t){
  if(ringF!==frameNo){ringF=frameNo;ringPhase+=dt*(25+bass*220);}
  const cx=x+w/2,cy=y+h/2,sp=16,maxR=Math.hypot(w,h)/2+sp*2,ph=ringPhase%(sp*2),N=Math.ceil(maxR/sp)+2;

      const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;s?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.fill();

const phi=(1+Math.sqrt(5))/2;
const IV=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];
const IE=[];for(let i=0;i<12;i++)for(let j=i+1;j<12;j++){const d=IV[i].reduce((s,v,k)=>s+(v-IV[j][k])**2,0);if(Math.abs(d-4)<0.01)IE.push([i,j]);}
let rotA=0,rotB=0,rotF=-1;
function drawWire(x,y,w,h,t){
  if(rotF!==frameNo){rotF=frameNo;rotA+=dt*(0.4+mid*2);rotB+=dt*(0.3+bass*3);}
  const cx=x+w/2,cy=y+h/2,S=Math.min(w,h)*0.2;
  const shape=(scale,dir,col,spike)=>{
    const ca=Math.cos(rotA*dir),sa=Math.sin(rotA*dir),cb=Math.cos(rotB*dir),sb=Math.sin(rotB*dir);
    const Pt=IV.map((v,i)=>{const k=1+(spike?band(i*3,40)*0.7:0);const a=v[0]*k,b=v[1]*k,c=v[2]*k;
      const y1=b*ca-c*sa,z1=b*sa+c*ca,x2=a*cb+z1*sb,z2=-a*sb+z1*cb,p=4/(4+z2*0.5);

}

// ===== PRISM SHATTER (TouchDesigner-style: image -> 40x22 plates -> flying coloured prisms + wireframes + solids)
const PR_COLS=['#ff1a1a','#ffe600','#1f3cff','#00d26a','#ff2bd6','#00e5ff','#ffffff','#ff7a00','#7a00ff'];
const prHash=(i,s)=>{const v=Math.sin(i*127.1+s*311.7)*43758.5453;return v-Math.floor(v);};
const prNoise=(x,y,t)=>Math.sin(x*1.7+t*1.3)*Math.cos(y*2.3-t*0.9)+Math.sin((x+y)*0.9+t*0.7)*0.5;
let PR={src:null,cells:null,gw:40,gh:22,next:0,seed:0,parts:[],white:0,shapes:0};
const prImgs=()=>bigImgs();
function prBuild(src){
  const gw=PR.gw,gh=PR.gh,c=document.createElement('canvas');c.width=gw;c.height=gh;const g=c.getContext('2d',{willReadFrequently:true});
  const[sx,sy,sw,sh]=coverCrop(src,gw*10,gh*10);g.drawImage(src,sx,sy,sw,sh,0,0,gw,gh);
  const d=g.getImageData(0,0,gw,gh).data;let br=0,bg=0,bb=0,n=0;
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)if(x<2||y<2||x>=gw-2||y>=gh-2){const o=(y*gw+x)*4;br+=d[o];bg+=d[o+1];bb+=d[o+2];n++;}
  br/=n;bg/=n;bb/=n;const cells=[];
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const o=(y*gw+x)*4,r=d[o],gg=d[o+1],b=d[o+2];
    const dist=Math.hypot(r-br,gg-bg,b-bb),cx=(x/gw-0.5),cy=(y/gh-0.5),centre=1-Math.hypot(cx*1.3,cy)*1.2;
    const lum=(r*0.3+gg*0.59+b*0.11)/255;cells.push({x,y,lum,sc:dist/255+centre*0.8,i:y*gw+x,col:PR_COLS[Math.floor(prHash(y*gw+x,lum*9)*PR_COLS.length)],k:Math.floor(prHash(x,y)*4)});}
  cells.sort((a,b)=>b.sc-a.sc);cells.length=Math.round(cells.length*0.34);
  PR.cells=cells;PR.src=src;PR.seed=Math.random()*99;
}
function drawPrism(x,y,w,h,t){
  if(!PR.cells||t>PR.next){const l=prImgs();if(l.length)prBuild(pick(l));PR.next=t+rnd(7,12);PR.shapes=Math.floor(rnd(0,3));}
  if(beat&&beatPower>0.75&&Math.random()<0.3)PR.white=1;PR.white=Math.max(0,PR.white-dt*3);
  ctx.fillStyle=PR.white>0.5?'#fff':'#000';ctx.fillRect(x,y,w,h);
  if(!PR.cells)return;
  const gw=PR.gw,gh=PR.gh,cw=w/gw,ch=h/gh,push=(0.25+bass*1.6*INTENSITY),tt=t*0.6+PR.seed;
  // ghost of the source image (very faint, like the TD comp preview)
  if(PR.white<=0.5&&ready(PR.src)){const[sx,sy,sw,sh]=coverCrop(PR.src,w,h);ctx.globalAlpha=0.06+high*0.1;ctx.drawImage(PR.src,sx,sy,sw,sh,x,y,w,h);ctx.globalAlpha=1;}
  for(const c of PR.cells){
    const n1=prNoise(c.x*0.21,c.y*0.21,tt),n2=prNoise(c.y*0.17+5,c.x*0.19,tt*1.2);
    const amt=Math.max(0,n1+0.35)*push*(0.4+c.lum),px=x+(c.x+0.5)*cw+n2*amt*cw*3,py=y+(c.y+0.5)*ch-amt*ch*2.2+n1*ch*amt;
    const sz=Math.max(cw,ch)*(0.55+amt*1.1+mid*0.5),ang=n2*3+t*(0.5+c.k*0.3);
    ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.fillStyle=c.col;ctx.beginPath();
    if(c.k===3&&amt>0.5){ctx.arc(0,0,sz*0.45,0,Math.PI*2);}else{ctx.moveTo(0,-sz*0.6);ctx.lineTo(sz*0.55,sz*0.45);ctx.lineTo(-sz*0.5,sz*0.4*(0.6+c.lum));ctx.closePath();}
    ctx.fill();ctx.restore();
  }
  // wireframes on top (black on white / white on black)
  ctx.strokeStyle=PR.white>0.5?'#000':'#fff';ctx.lineWidth=1.3;
  for(let s=0;s<3;s++){const sx=x+w*(0.25+0.25*s)+Math.sin(t*0.4+s*2)*w*0.12,sy=y+h*(0.55+0.2*Math.sin(t*0.3+s)),R=Math.min(w,h)*(0.12+bass*0.08+s*0.02),a=t*(0.5+s*0.2);
    ctx.beginPath();
    if((s+PR.shapes)%3===0){for(let k=0;k<6;k++){ctx.ellipse(sx,sy,R,R*Math.abs(Math.cos(a+k*0.5)),k*0.52,0,Math.PI*2);}}
    else if((s+PR.shapes)%3===1){const v=[];for(let k=0;k<8;k++){const X=(k&1?1:-1),Y=(k&2?1:-1),Z=(k&4?1:-1),xx=X*Math.cos(a)-Z*Math.sin(a),zz=X*Math.sin(a)+Z*Math.cos(a),yy=Y*Math.cos(a*0.7)-zz*Math.sin(a*0.7);v.push([sx+xx*R*0.6,sy+yy*R*0.6]);}
      for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const d=(i^j);if(d===1||d===2||d===4){ctx.moveTo(v[i][0],v[i][1]);ctx.lineTo(v[j][0],v[j][1]);}}}

    p.x+=p.vx*dt/w;p.y+=p.vy*dt/h;p.vy+=40*dt;p.r+=dt*4;const px=x+p.x*w,py=y+p.y*h;ctx.fillStyle=p.c;ctx.strokeStyle=p.c;

    ctx.restore();}
  ctx.fillStyle=PR.white>0.5?'#000':'#fff';ctx.font='11px monospace';ctx.textAlign='left';ctx.textBaseline='bottom';
  ctx.fillText('br_geo · '+PR.cells.length+'/880 plates · object_particles '+PR.parts.length+'/320',x+6,y+h-4);

function ktCity(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,512,512);
  for(let i=0;i<150;i++){const bw=rnd(8,60),bh=rnd(20,220),bx=rnd(0,512),by=rnd(0,512);const v=Math.random()<0.55?255:Math.floor(rnd(20,120));g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(bx,by,bw,bh);
    g.fillStyle='#000';for(let wy=by+4;wy<by+bh-4;wy+=rnd(5,10))for(let wx=bx+3;wx<bx+bw-3;wx+=rnd(4,9))if(Math.random()<0.6)g.fillRect(wx,wy,2,3);}
  g.strokeStyle='#fff';g.lineWidth=2;for(let i=0;i<10;i++){g.beginPath();g.moveTo(rnd(0,512),rnd(0,512));g.lineTo(rnd(0,512),rnd(0,512));g.stroke();}

function ktCat(src){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d',{willReadFrequently:true});const[sx,sy,sw,sh]=coverCrop(src,512,512);g.drawImage(src,sx,sy,sw,sh,0,0,512,512);
  const im=g.getImageData(0,0,512,512),d=im.data;for(let i=0;i<d.length;i+=4){const l=d[i]*0.3+d[i+1]*0.59+d[i+2]*0.11,v=l>150?255:l>80?110:0;d[i]=d[i+1]=d[i+2]=v;}g.putImageData(im,0,0);return c;}
const KT_TINTS=[null,'#2a3cff','#ffd400','#7fb2ff'];
function ktTint(base,tint){if(!tint)return base;const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.drawImage(base,0,0);g.globalCompositeOperation='multiply';g.fillStyle=tint;g.fillRect(0,0,512,512);
  g.globalCompositeOperation='screen';g.globalAlpha=0.25;g.drawImage(base,0,0);return c;}
function drawKaleido(x,y,w,h,t){
  if(!KT.city)KT.city=ktCity();
  if(!KT.tex||t>KT.next||(beat&&beatPower>0.9&&Math.random()<0.25)){
    KT.useCat=Math.random()<0.45;const l=prImgs();const base=KT.useCat&&l.length?ktCat(pick(l)):KT.city;
    KT.tint=Math.floor(rnd(0,KT_TINTS.length));KT.tex=ktTint(base,KT_TINTS[KT.tint]);KT.n=PHONE?pick([6,8]):pick([6,8,8,10,12]);KT.next=t+rnd(4,9);}
  KT.zoom+=dt*(0.15+bass*1.4);KT.flash=Math.max(KT.flash-dt*2.5,beat?beatPower:0);
  ctx.fillStyle='#000';ctx.fillRect(x,y,w,h);
  const cx=x+w/2,cy=y+h/2,R=Math.hypot(w,h)/2+4,N=KT.n,seg=Math.PI*2/N,sc=(0.55+Math.sin(KT.zoom*0.7)*0.18+bass*0.25)*Math.min(w,h)/330,rot=t*0.15+Math.sin(t*0.3)*0.4;
  const ox=(KT.zoom*60)%512,oy=(KT.zoom*35)%512;
  for(let i=0;i<N;i++){ctx.save();ctx.translate(cx,cy);if(i&1){ctx.rotate((i+1)*seg+rot);ctx.scale(1,-1);}else ctx.rotate(i*seg+rot);
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,-0.002,seg+0.002);ctx.closePath();ctx.clip();
    ctx.rotate(seg/2);ctx.scale(sc,sc);

  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,R);g.addColorStop(0,`rgba(200,220,255,${0.7*KT.flash})`);g.addColorStop(0.12,`rgba(80,110,255,${0.25*KT.flash})`);g.addColorStop(0.5,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');

    case 'term':{
      ctx.font='12px Menlo,Consolas,monospace';ctx.textBaseline='top';ctx.fillStyle='#e6ecff';

function drawChrome(wn,x,y,full,t){
  const w=wn.w,h=wn.h,tb=wn.tb,r=Math.min(9,tb*0.5);
  if(!full){ // fast path for drag-trail copies
    ctx.fillStyle=wn.body;rr(x,y,w,h,r);ctx.fill();
    ctx.fillStyle=wn.dark?'#2c2c2e':'#ececec';ctx.fillRect(x+2,y+1,w-4,tb-1);
    ctx.strokeStyle=wn.dark?'rgba(255,255,255,0.16)':'rgba(0,0,0,0.3)';ctx.lineWidth=1;ctx.stroke();return;}
  ctx.fillStyle='rgba(0,0,30,0.32)';rr(x+3,y+6,w,h,r);ctx.fill();

  ctx.fillStyle=wn.body;ctx.fillRect(x,y+tb,w,h-tb);

  ['#ff5f57','#febc2e','#28c840'].forEach((c,i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+dr+6+i*(dr*2+5),cy,dr,0,7);ctx.fill();});

}
function drawWin(wn,t){

    for(let k=K;k>=1;k--){const a=head-k*wn.step;drawChrome(wn,wn.x0+wn.vx*a,wn.y0+wn.vy*a,false,t);}
  }

/* ================= HOLOGRAM (3D point cloud made of code, off by default) ================= */
let HOLO=null;
function buildHolo(){
  const src=bigImgs()[0];if(!ready(src))return null;
  const GW=96,GH=Math.round(96*src.naturalHeight/src.naturalWidth);
  const c=document.createElement('canvas');c.width=GW;c.height=GH;const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(src,0,0,GW,GH);const d=g.getImageData(0,0,GW,GH).data;
  // flood-fill the background from the edges until we hit the sticker's white outline -> clean silhouette
  const bg=new Uint8Array(GW*GH),st=[];const lum=i=>(d[i*4]*0.3+d[i*4+1]*0.59+d[i*4+2]*0.11);
  for(let x=0;x<GW;x++){st.push(x,(GH-1)*GW+x);}for(let y=0;y<GH;y++){st.push(y*GW,y*GW+GW-1);}
  while(st.length){const i=st.pop();if(bg[i]||lum(i)>200)continue;bg[i]=1;const x=i%GW,y=(i/GW)|0;
    if(x>0)st.push(i-1);if(x<GW-1)st.push(i+1);if(y>0)st.push(i-GW);if(y<GH-1)st.push(i+GW);}
  // half-width per row for a rounded body (so it looks volumetric when it turns)
  const pts=[];
  for(let y=0;y<GH;y++){let l=GW,r=-1;for(let x=0;x<GW;x++)if(!bg[y*GW+x]){if(x<l)l=x;if(x>r)r=x;}
    if(r<0)continue;const cx=(l+r)/2,hw=Math.max(1,(r-l)/2);
    for(let x=l;x<=r;x++){const i=y*GW+x;if(bg[i])continue;const L=lum(i)/255,u=(x-cx)/hw,bul=Math.sqrt(Math.max(0,1-u*u));
      pts.push({x:(x-GW/2)/GW,y:(y-GH/2)/GW,z:bul*0.34+(L-0.5)*0.06,L,ch:'01ニャ<>/{}#=+*'[(x*7+y*13)%13]});
      if(bul>0.25&&(x+y)%2===0)pts.push({x:(x-GW/2)/GW,y:(y-GH/2)/GW,z:-bul*0.30,L:L*0.55,ch:'01'[(x+y)%2]}); // back shell
    }}
  return {pts,aspect:GH/GW};
}
function drawHolo(x,y,w,h,t){
  if(!HOLO)HOLO=buildHolo();
  ctx.fillStyle='#000a06';ctx.fillRect(x,y,w,h);
  // faint code rain behind
  ctx.font='11px monospace';ctx.textBaseline='top';ctx.fillStyle='rgba(57,255,20,0.12)';
  for(let i=0;i<w/14;i++){const cy=((t*60*(0.5+(i*37%10)/10)+i*53)%(h+80))-40;ctx.fillText('01ニャ'[(i+Math.floor(t*8))%4],x+i*14,y+cy);}
  if(!HOLO){ctx.fillStyle='#39ff14';ctx.fillText('loading model.obj…',x+10,y+10);return;}
  const ang=(window.__holoAng!=null?window.__holoAng:t*0.9+bass*0.6),ca=Math.cos(ang),sa=Math.sin(ang),S=Math.min(w*0.9,h*0.92/HOLO.aspect),cx=x+w/2,cy=y+h/2+h*0.02,fl=1.6;

/* ================= OPTIC LAB (fluted glass · directional blur · ripple · HUD data points) ================= */
const optCache=new Map();
function opticSrc(src,w,h,contain){ // mono, high-contrast buffer (cover-cropped, or contained on black for the hero shot)
  src._tid=src._tid||++tidN;const k=src._tid+':'+w+'x'+h+(contain?'c':'');let c=optCache.get(k);if(c)return c;
  c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.filter='grayscale(1) contrast(1.35) brightness(1.05)';
  if(contain){g.fillStyle='#000';g.fillRect(0,0,w,h);const sw=src.naturalWidth||src.width,sh=src.naturalHeight||src.height,sc=Math.min(h*0.95/sh,w*0.5/sw),dw=sw*sc,dh=sh*sc;g.drawImage(src,w*0.68-dw/2,(h-dh)/2,dw,dh);}
  else{const r=coverCrop(src,w,h);g.drawImage(src,r[0],r[1],r[2],r[3],0,0,w,h);}
  g.filter='none';
  optCache.set(k,c);while(optCache.size>12)optCache.delete(optCache.keys().next().value);return c;
}
let optSeed=1,optPick=[0,1,2],optMode=0,optT=0,optRed=false;
const optImgs=()=>bigImgs();
function optShuffle(){const L=optImgs();if(!L.length)return;optPick=[0,1,2].map(()=>Math.floor(Math.random()*L.length));optMode=(optMode+1)%4;optRed=false;optSeed=Math.random()*1000;}
function fluted(img,x,y,w,h,t){
  const n=Math.max(18,Math.floor(w/22)),sw=w/n,k=1.6+bass*1.4;
  for(let i=0;i<n;i++){
    const wob=Math.sin(i*0.55+t*1.3)*sw*(0.6+mid*2),sx=Math.max(0,Math.min(w-sw*k,i*sw-sw*(k-1)/2+wob));
    ctx.drawImage(img,sx,0,sw*k,h,x+i*sw,y,sw+0.6,h);
  }
  const g=ctx.createLinearGradient(0,0,sw,0);g.addColorStop(0,'rgba(255,255,255,0.0)');g.addColorStop(0.15,'rgba(255,255,255,0.28)');g.addColorStop(0.5,'rgba(255,255,255,0.02)');g.addColorStop(1,'rgba(0,0,0,0.35)');
  ctx.save();ctx.fillStyle=g;for(let i=0;i<n;i++){ctx.setTransform(1,0,0,1,x+i*sw,0);ctx.fillRect(0,y,sw,h);}ctx.restore();
}
function dirBlur(img,x,y,w,h,t){
  ctx.drawImage(img,x,y,w,h);

  ctx.save();ctx.globalCompositeOperation='lighten';

}
function ripple(img,x,y,w,h,t){
  ctx.drawImage(img,x,y,w,h);
  const cx=x+w/2,cy=y+h*0.45,R=Math.hypot(w,h)*0.55,st=Math.round(26-10*Q);
  for(let r=R;r>8;r-=st){

    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    ctx.translate(cx,cy);ctx.scale(s,s);ctx.translate(-cx,-cy);ctx.drawImage(img,x,y,w,h);ctx.restore();
  }

function bubbles(img,x,y,w,h,t){
  ctx.drawImage(img,x,y,w,h);

    const bx=x+w*(0.15+0.7*((Math.sin(i*12.9+optSeed)+1)/2)),by=y+h*(0.15+0.7*((Math.sin(i*7.3+optSeed*1.7)+1)/2)),br=Math.min(w,h)*(0.07+0.05*((i*37)%5)/5)*(1+beatPower*0.3),z=1.7;

function hud(x,y,w,h,t,seed){
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.fillStyle='#fff';ctx.lineWidth=1;ctx.font='11px "Ubuntu Mono",Menlo,monospace';ctx.textBaseline='middle';

    if(t-sceneT>dur&&(beat||t-sceneT>dur+4)){curScene=SCENE_ORDER[(SCENE_ORDER.indexOf(curScene)+1)%SCENE_ORDER.length];sceneT=t;flashT=t;if(curScene==='optic'){optShuffle();optT=t;}}}
  if(curScene==='desktop'){drawDesktop(t);}
  else if(curScene==='optic'){drawOptic(t);}
  else{
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    const shake=beatPower>0.6?(Math.random()-.5)*16*beatPower*INTENSITY:0;
    ctx.save();ctx.translate(shake,(Math.random()-.5)*shake);
    for(const p of panels)drawPanel(p,t);
    ctx.restore();
    if(beat&&beatPower>0.7&&Math.random()<0.4)spawnPopup();
    drawPopups(t);
  }
  drawDeckFlash(t);
  drawLogo(t);
  if(beat&&beatPower>0.75&&t-lastTakeover>TAKEOVER_EVERY&&t-logoT>LOGO_DUR)triggerTakeover();
  drawTakeover(t);
  if(beatPower>0.55){
    const n=Math.floor(beatPower*6*INTENSITY*Q);
    if(n>0){snx.drawImage(cv,0,0);for(let i=0;i<n;i++){const hh=rnd(5,60),sy=Math.random()*(H-hh);ctx.drawImage(snap,0,sy,W,hh,(Math.random()-.5)*80*beatPower,sy,W,hh);}}
  }
  ctx.globalAlpha=curScene==='desktop'?0.05:0.18;ctx.drawImage(scan,0,0);ctx.globalAlpha=1;
  if(curScene==='wall')ctx.drawImage(vign,0,0);
  const fa=1-(t-flashT)/0.12;if(fa>0){ctx.fillStyle=`rgba(255,255,255,${fa})`;ctx.fillRect(0,0,W,H);}
  if(!ui.classList.contains('collapsed')&&!document.body.classList.contains('noui')){meterEl.style.width=Math.min(100,level*160)+'%';meterEl.style.background=level>0.55?'#ff3355':'#39ff14';}
}

  const su=document.getElementById('su');if(THEME.name&&su&&su.style.display!=='none'){su.style.display='none';showPlayMusic();}return 'ok '+THEME.name;};
(async()=>{let t=await STORE.load().catch(()=>null);if(!(t&&t.v)&&APPMODE){try{t=await (await fetch('http://localhost:17777/theme.json',{cache:'no-store'})).json();}catch(e){}}if(THEME_INJECTED)return;
  if(t&&t.v){THEME=Object.assign({v:1,name:'',texts:null,images:[],logo:null,group:''},t);applyTheme();}
  const noSetup=P.get('setup')==='0'||P.get('hideui')==='1'||WSMODE;

/* ================= INPUT ================= */
addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  const k=e.key.toLowerCase();
  if(k==='h')document.body.classList.toggle('noui');
  else if(k==='p'){curScene==='desktop'?spawnCascade(alertWin()):spawnPopup();}
  else if(k==='1'){scene='desktop';curScene='desktop';flashT=tNow;}
  else if(k==='2'){scene='wall';curScene='wall';flashT=tNow;}
  else if(k==='0'){scene='auto';sceneT=tNow;}
  else if(k==='m')triggerTakeover();
  else if(k==='l')showLogo();
  else if(k===' '){catIdx=(catIdx+1)%cats.length;catSwitchT=tNow;e.preventDefault();}
  else if(k==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();for(const f of e.dataTransfer.files){if(f.type.startsWith('image/'))addPicFile(f);else if(f.type.startsWith('audio/'))startFile(f);}});

// OBS auto-start: ?autostart=input&device=cable&hideui=1
// Keeps retrying every 3s until the named device shows up (e.g. VB-Cable / VirtualDJ not open yet).
async function autoStart(){
  if(P.get('autostart')!=='input')return;
  try{
    const want=(P.get('device')||'').toLowerCase();
    if(!want){await startInput();return;}
    let ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
    if(!ds.some(d=>d.label)){await startInput();ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');}
    const d=ds.find(d=>d.label.toLowerCase().includes(want));
    if(d)await startInput(d.deviceId);
    else{disconnect();mode='demo';status('waiting for device "'+want+'"…');setTimeout(autoStart,3000);}
  }catch(err){mode='demo';status('input failed: '+err.message+' — retrying');setTimeout(autoStart,3000);}
}
autoStart();
// ===== Desktop app: audio ONLY from allowed programs (YouTube, Spotify, VirtualDJ, Media Player) =====
if(APPMODE&&window.appAudio){
  ['bSys','bMic','bDemo','dev'].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display='none';});
  const fa=document.getElementById('fAudio');if(fa)fa.parentElement.style.display='none';
  ensureCtx();disconnect();mode='apps';
  const SR=48000,CAP=SR*2,rings=new Map();
  const ring=pid=>{let g=rings.get(pid);if(!g){g={b:new Float32Array(CAP),r:0,w:0,n:0,last:0};rings.set(pid,g);}return g;};
  window.appAudio.onChunk((pid,u8)=>{
    const g=ring(pid);g.last=performance.now();
    const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength),ns=u8.byteLength>>1;
    for(let i=0;i<ns;i++){g.b[g.w]=dv.getInt16(i*2,true)/32768;g.w=(g.w+1)%CAP;if(g.n<CAP)g.n++;else g.r=(g.r+1)%CAP;}
    if(g.n>SR*2*0.15){let drop=g.n-Math.floor(SR*2*0.05);drop-=drop%2;g.r=(g.r+drop)%CAP;g.n-=drop;} // keep latency low
  });
  const sp=actx.createScriptProcessor(1024,1,2);
  sp.onaudioprocess=e=>{
    const L=e.outputBuffer.getChannelData(0),R=e.outputBuffer.getChannelData(1);L.fill(0);R.fill(0);
    const now=performance.now();
    for(const [pid,g] of rings){
      if(now-g.last>4000&&g.n<2){rings.delete(pid);continue;}
      for(let i=0;i<L.length&&g.n>=2;i++){L[i]+=g.b[g.r];R[i]+=g.b[(g.r+1)%CAP];g.r=(g.r+2)%CAP;g.n-=2;}
    }
  };
  sp.connect(gainNode);
  const mute=actx.createGain();mute.gain.value=0;sp.connect(mute);mute.connect(actx.destination); // analysis only, never plays out loud
  status('waiting for YouTube / Spotify / VirtualDJ / Media Player…');
  if(P.get('app')==='1'){const d=document.createElement('div');d.className='hint';d.style.color='#39ff14';
    d.textContent='OBS: Window Capture → [Glitch Visualizer.exe], method Windows 10 (1903 and up), Capture Cursor off.';
    document.getElementById('status').after(d);}
  window.appAudio.onDecks&&window.appAudio.onDecks(setDecks);
  window.appAudio.onStatus(list=>{NOW=list.map(o=>typeof o==='string'?{label:o,title:''}:o);const L=[...new Set(NOW.map(o=>o.label))];status(L.length?'🔊 listening to: '+L.join(', '):'waiting for YouTube / Spotify / VirtualDJ / Media Player…');});
}

# Builds the apps and publishes them as a GitHub Release:
#   Windows: Glitch-Visualizer-Setup.exe (installer) + Glitch-Visualizer.exe (portable, no install)
#   Mac:     Glitch-Visualizer-Mac.zip (Apple Silicon + Intel)
# Run it: Actions tab -> "Build apps" -> Run workflow (type the version, e.g. v1.0.1), or push a tag like v1.0.1.
name: Build apps
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.t.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Glitch Visualizer ${{ steps.t.outputs.tag }}
          body_path: .github/RELEASE_NOTES.md
          draft: true
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: app
      - run: npm run dist
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: true
          files: |
            app/dist/Glitch-Visualizer-Setup.exe
            app/dist/Glitch-Visualizer.exe
  mac:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: app
      - run: npm run dist-mac
        working-directory: app
        env: { CSC_IDENTITY_AUTO_DISCOVERY: false }
      - name: Sign (ad-hoc) and zip
        working-directory: app/dist
        run: |
          APP="$(find . -maxdepth 2 -name '*.app' | head -1)"
          echo "found: $APP"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Glitch-Visualizer-Mac.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: true
          files: app/dist/Glitch-Visualizer-Mac.zip
  publish:
    needs: [release, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          draft: false
          make_latest: true
